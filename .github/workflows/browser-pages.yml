name: Browser app
on:
  push:
    branches: [main, master]
    paths: ['browser/**', '.github/workflows/browser-pages.yml', '.github/scripts/**']
  pull_request:
    paths: ['browser/**', '.github/workflows/browser-pages.yml', '.github/scripts/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: browser/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: browser
      - run: pnpm test
        working-directory: browser
      - run: pnpm build
        working-directory: browser
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: browser/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published app
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python .github/scripts/verify-pages.py "$SITE_URL"
